[project]
name = "agentic-writing-system"
version = "0.1.0"
description = "A workspace for writing fiction with agents over a shared Story Bible."
readme = "docs/README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi (>=0.162.2,<0.163.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "pydantic (>=2.14.3,<3.0.0)", "langchain (>=1.4.9,<2.0.0)", "langgraph (>=1.2.20,<2.0.0)", "langgraph-checkpoint-sqlite (>=3.1.3,<4.0.0)", "langgraph-checkpoint-postgres (>=3.2.0,<4.0.0)", "sqlalchemy[asyncio] (>=2.1.8,<3.0.0)", "alembic (>=1.20.1,<2.0.0)", "aiosqlite (>=0.22.1,<0.23.0)", "psycopg[binary] (>=3.3.8,<4.0.0)"]

[tool.poetry]
packages = [{ include = "agentic_writing_system", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.4.1.post1"
mypy = "^2.4.1"
ruff = "^0.17.4"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
strict = true
